name: Preview checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test-package:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        node: ['22.19.0', '24']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Install locked dependencies without lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Build and test
        run: npm test
      - name: Check package contents and portable lock
        run: npm run verify:package
      - name: Build local archive
        run: npm pack --ignore-scripts
      - uses: actions/upload-artifact@v4
        with:
          name: governance-preview-${{ matrix.os }}-node${{ matrix.node }}
          path: '*.tgz'
          if-no-files-found: error
